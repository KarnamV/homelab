#!/usr/bin/env bash
# homelab/scripts/backup.conf
#
# Configuration for backup.sh / restore.sh. This file is sourced (`. `) by
# both scripts, not executed — it's plain bash variable assignments, which
# lets values reference earlier ones (e.g. ${HOMELAB_ROOT}). Safe to commit:
# no secrets live here (the Postgres/Grafana credentials it needs come from
# the containers' own .env files, which stay gitignored as always).
#
# Copy this file if you want a machine-local override instead of editing it
# directly — run backup.sh/restore.sh with `-c /path/to/your.conf`.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

# Repo root. The monitoring stack used to live outside the repo
# (/home/bitforge/docker/monitoring) — it's now folded in under
# compose/monitoring/, so it no longer needs its own root/path variables;
# CONFIG_PATHS_HOMELAB below already covers it.
HOMELAB_ROOT="/home/bitforge/homelab"

# Where backups are written. NOTE: this is currently on the same physical
# disk as HOMELAB_ROOT/data — fine as a first line of defense (accidental
# deletion, bad config push, container corrupting its own data) but it is
# NOT an off-host copy and won't survive a disk/host failure. Point this at
# a second disk or a mounted network share when you have one, and/or sync
# BACKUP_ROOT offsite (rclone/rsync to another machine or cloud storage) —
# see "Off-host copies" in docs/backup-restore.md.
BACKUP_ROOT="${HOMELAB_ROOT}/backups"

# Subdirectories under BACKUP_ROOT (rarely need to change these).
RUNS_DIR="${BACKUP_ROOT}/runs"     # one directory per night, e.g. runs/2026-07-24/
LOG_DIR="${BACKUP_ROOT}/logs"      # backup-*.log / restore-*.log
STATE_DIR="${BACKUP_ROOT}/state"   # persistent state (GNU tar --listed-incremental snapshot files)

# ---------------------------------------------------------------------------
# Retention
# ---------------------------------------------------------------------------

# Full-only sources (everything except Loki, see below): delete an entire
# run directory once it is older than this many days.
RETENTION_DAYS=14

# Loki is the one incremental source (weekly full + daily incrementals — see
# "Incremental backups" in docs/backup-restore.md for why only Loki gets
# this treatment). Retention for it is measured in full-backup cycles
# instead of days, so a full archive is never deleted while a kept
# incremental still depends on it. 3 cycles ~= 3 weeks of Loki history.
RETENTION_CYCLES=3

# Day of week (as printed by `date +%a`, e.g. Sun/Mon/.../Sat) that starts a
# new Loki full-backup cycle. Every other day is an incremental.
LOKI_FULL_DAY="Sun"

# ---------------------------------------------------------------------------
# Safety checks
# ---------------------------------------------------------------------------

# Backup aborts before touching anything if free space on BACKUP_ROOT's
# filesystem is below this, in MB. Rough guide: this stack's data/ is
# currently well under 1GB; 2048 leaves comfortable headroom for growth
# (Loki/Prometheus in particular) plus the temporary space pg_dump and the
# archive-verification step need. Raise this if your data set grows.
MIN_FREE_SPACE_MB=2048

# ---------------------------------------------------------------------------
# Compression
# ---------------------------------------------------------------------------

ARCHIVE_EXT="tar.gz"
GZIP_LEVEL=6   # 1 (fastest/largest) .. 9 (slowest/smallest)

# ---------------------------------------------------------------------------
# Docker Swarm service / volume names
# ---------------------------------------------------------------------------
# These are Swarm SERVICE names (`docker service ls` — "<stack>_<service>"),
# not container names: since the migration to Docker Swarm, containers get
# generated names per task and are resolved from the service name at
# runtime via resolve_container() in lib/backup-common.sh. Must match
# `docker service ls` / `docker volume ls`.

AUTHENTIK_PG_CONTAINER="authentik_authentik-postgresql"
AUTHENTIK_PG_USER="authentik"
AUTHENTIK_PG_DB="authentik"

UPTIME_KUMA_CONTAINER="uptime-kuma_uptime-kuma"
LOKI_CONTAINER="loki_loki"

GRAFANA_VOLUME="monitoring_grafana-data"
PROMETHEUS_VOLUME="monitoring_prometheus-data"

# Helper image used for read-only tar of Docker-managed named volumes
# (grafana-data, prometheus-data) that bitforge can't read directly from the
# host filesystem. Must already be pulled locally — backup.sh runs it with
# `--pull=never` deliberately, so a nightly run never depends on network
# access / a registry being reachable. `docker pull alpine:latest` once by
# hand if it's ever missing (`docker images` to check).
HELPER_IMAGE="alpine:latest"

# ---------------------------------------------------------------------------
# Bind-mounted data directories backed up in full every night (name:path).
# Read directly off the host filesystem inside a throwaway HELPER_IMAGE
# container (read-only mount) — this sidesteps the fact that some of these
# are root-owned (portainer, uptime-kuma) while backup.sh itself runs as a
# regular user; see docs/backup-restore.md "Why a helper container".
# ---------------------------------------------------------------------------

BIND_MOUNTS_FULL=(
  "homepage:${HOMELAB_ROOT}/data/homepage"
  "portainer:${HOMELAB_ROOT}/data/portainer"
  "promtail:${HOMELAB_ROOT}/data/promtail"
  "uptime-kuma-sync:${HOMELAB_ROOT}/data/uptime-kuma-sync"
)

# Authentik's data dir is handled by its own function (backup_authentik_app)
# rather than the generic loop above, because the postgres/ subdirectory
# INSIDE it must never be tar'd directly (it's a live Postgres data
# directory — see "Why not just tar Postgres's data dir" in the docs) even
# though the rest of the directory (media/templates/certs) is fine.
AUTHENTIK_APP_DATA_DIR="${HOMELAB_ROOT}/data/authentik"

# ---------------------------------------------------------------------------
# The one incremental bind-mounted source. Owned by bitforge:bitforge and
# world-readable, so this one - unlike the ones above - is tar'd directly by
# the host's own GNU tar (needed for --listed-incremental support, which the
# busybox tar in Alpine doesn't have).
# ---------------------------------------------------------------------------

LOKI_DATA_DIR="${HOMELAB_ROOT}/data/loki"

# ---------------------------------------------------------------------------
# Configuration / compose files to archive (paths, not name:path pairs —
# these don't need the helper-container trick, all readable by bitforge).
# ---------------------------------------------------------------------------

# Includes compose/monitoring/ (Prometheus/Grafana config), folded in here
# since the Swarm migration — no separate monitoring path list needed
# anymore.
CONFIG_PATHS_HOMELAB=(
  "${HOMELAB_ROOT}/compose"
  "${HOMELAB_ROOT}/docs"
  "${HOMELAB_ROOT}/certs"
)
