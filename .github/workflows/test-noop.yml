name: Reusable - No-op test

on:
  workflow_call:
    inputs:
      services:
        required: true
        type: string
      image_prefix:
        required: true
        type: string
    outputs:
      tag:
        value: ${{ jobs.noop.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  noop:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=sha-test" >> "$GITHUB_OUTPUT"
      - run: echo "image_prefix=${{ inputs.image_prefix }} services=${{ inputs.services }}"
