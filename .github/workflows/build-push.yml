name: Reusable - Build and push images to GHCR

# Called by an app repo's own workflow (e.g. nest/.github/workflows/deploy.yml).
# Builds one image per entry in `services`, pushes each as
# ghcr.io/<owner>/<image_prefix>-<service.name>:sha-<short-sha> and :latest.
# github.sha/github.repository_owner reflect the CALLING repo, not this one,
# so the tag always matches the commit that triggered the caller's workflow.

on:
  workflow_call:
    inputs:
      services:
        description: >
          JSON array of {name, context, dockerfile}, e.g.
          '[{"name":"web","context":"./apps/web","dockerfile":"./apps/web/Dockerfile"}]'
        required: true
        type: string
      image_prefix:
        description: 'Prefix for image names, e.g. "nest" -> ghcr.io/<owner>/nest-<name>'
        required: true
        type: string
    outputs:
      tag:
        description: 'The sha-<short-sha> tag applied to every built image'
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        service: ${{ fromJson(inputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Docker/GHCR image names must be all-lowercase; github.repository_owner
      # preserves the account's actual casing (e.g. "KarnamV"), which fails
      # `docker buildx build` with "repository name must be lowercase".
      - id: names
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "prefix=$(echo '${{ inputs.image_prefix }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "service=$(echo '${{ matrix.service.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.prefix }}-${{ steps.names.outputs.service }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.prefix }}-${{ steps.names.outputs.service }}:latest
