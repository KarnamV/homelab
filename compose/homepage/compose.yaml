services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ../../data/homepage:/app/config

    environment:
      PUID: 1000
      PGID: 1000
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.165,192.168.0.165:3000,localhost,localhost:3000,bitforge,bitforge:3000,homepage.bitforge,homepage.bitforge:3000

    networks:
      - homepage
      - proxy

    deploy:
      replicas: 1
      labels:
        - traefik.enable=true

        # HTTP
        - traefik.http.routers.homepage.entrypoints=web
        - traefik.http.routers.homepage.rule=Host(`bitforge`) || Host(`homepage.bitforge`)
        - traefik.http.routers.homepage.middlewares=redirect-to-https@file

        # HTTPS — canonical host only. Authentik's forward_single Proxy
        # Provider is tied to one literal external_host (homepage.bitforge);
        # it does not recognize the `bitforge` alias, so that alias can't
        # share this router (see the bare-alias redirect router below).
        - traefik.http.routers.homepage-secure.entrypoints=websecure
        - traefik.http.routers.homepage-secure.rule=Host(`homepage.bitforge`)
        - traefik.http.routers.homepage-secure.tls=true
        - traefik.http.routers.homepage-secure.priority=10
        - traefik.http.routers.homepage-secure.middlewares=authentik-forwardauth@swarm

        # Bare `bitforge` (HTTPS) — redirect to the canonical host instead of
        # serving it directly, so it never has to go through forward-auth
        # itself (Authentik only knows about homepage.bitforge).
        - traefik.http.routers.homepage-bare.entrypoints=websecure
        - traefik.http.routers.homepage-bare.rule=Host(`bitforge`)
        - traefik.http.routers.homepage-bare.tls=true
        - traefik.http.routers.homepage-bare.middlewares=homepage-bare-redirect@swarm
        - traefik.http.middlewares.homepage-bare-redirect.redirectregex.regex=^https://bitforge/(.*)
        - traefik.http.middlewares.homepage-bare-redirect.redirectregex.replacement=https://homepage.bitforge/$${1}
        - traefik.http.middlewares.homepage-bare-redirect.redirectregex.permanent=true

        - traefik.http.services.homepage.loadbalancer.server.port=3000
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  homepage:

  proxy:
    external: true
    name: proxy-swarm
