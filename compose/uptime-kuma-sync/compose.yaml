services:
  uptime-kuma-sync:
    # `docker stack deploy` doesn't support `build:` — pre-built by
    # `docker compose build` (or `docker build -t uptime-kuma-sync-uptime-kuma-sync .`)
    # from this same directory's Dockerfile before deploying.
    image: uptime-kuma-sync-uptime-kuma-sync
    restart: unless-stopped

    environment:
      UPTIME_URL: "http://uptime-kuma:3001"
      UPTIME_USERNAME: ${UPTIME_USERNAME}
      UPTIME_PASSWORD: ${UPTIME_PASSWORD}
      SYNC_INTERVAL: "300"
      UPTIME_PRUNE_ORPHANED: "true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../data/uptime-kuma-sync:/app/state

    networks:
      - proxy

    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  proxy:
    external: true
    name: proxy-swarm
