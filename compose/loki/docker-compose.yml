services:
  loki:
    image: grafana/loki:3.7.3
    container_name: loki
    restart: unless-stopped

    user: "1000:1000"

    command: -config.file=/etc/loki/config.yml

    volumes:
      - ./config.yml:/etc/loki/config.yml:ro
      - ../../data/loki:/loki

    networks:
      - proxy

networks:
  proxy:
    external: true
